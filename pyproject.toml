[project]
name = "paprika-plugin"
version = "0.1.0"
description = "A Claude Code plugin for managing a Paprika 3 recipe library and planning a week of meals."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jeff Richley" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "tomlkit>=0.13",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jeffrichley/paprika"
Repository = "https://github.com/jeffrichley/paprika"

[project.scripts]
paprika = "paprika_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paprika_core"]

[dependency-groups]
dev = [
    "black>=24.4",
    "commitizen>=3.27",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "vulture>=2.11",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version", ".claude-plugin/plugin.json:version"]
tag_format = "v$version"

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
# Reached by pytest, by Typer's decorators, or by a dunder protocol rather than
# by a Python caller. A fixture requested purely for its side effect is unused
# by design.
ignore_names = [
    # Typer wires these by decorator.
    "main_callback",
    # Fixtures, autouse or requested for their effect.
    "no_network",
    "fake_paprika",
    "paprika_home",
    "credentials_present",
    "signed_in",
    "seeded",
    "stocked",
    "fake",
    "mirror",
    # Dunder and callback protocol parameters.
    "exc_type",
    "exc",
    "traceback",
    "args",
    "kwargs",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "Q", "SIM", "C90", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Fixtures legitimately take arguments they do not read, and pytest asserts
# are the point.
"tests/**" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning nobody has to act on becomes permanent. Every warning is an error,
# so a leaked handle or a deprecation is a failing build rather than a line in
# the output that everyone scrolls past.
filterwarnings = ["error"]
addopts = [
    "--cov=paprika_core",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["src/paprika_core"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
