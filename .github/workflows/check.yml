# The same gate `just check` runs locally, run on every push and pull request.
#
# It installs `just` through uv rather than a third-party action so the whole
# workflow depends on exactly one action beyond checkout, and so the gate has
# one definition — the justfile — rather than a copy here that can drift.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the project claims to support. A plugin installs into
        # whatever Python the user already has, so the floor is a promise and
        # each release in between is one somebody will actually run.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Black, Ruff, mypy, Vulture, pytest, coverage
        run: uvx --from rust-just just check

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    # A newly published advisory should be visible without blocking a code
    # change that has nothing to do with it.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Audit locked dependencies
        run: uvx --from rust-just just audit

  version:
    # Claude Code installs a plugin into a directory named by its version and
    # will not replace one it already holds. A change to what ships that does
    # not move the number is a change nobody receives — silently, with no error
    # anywhere. Four merged changes went out that way before anyone noticed.
    name: shipped changes move the version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version moved
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          ships=$(echo "$changed" | grep -E '^(src/|skills/|agents/|hooks/)' || true)
          if [ -z "$ships" ]; then
            echo "Nothing that ships changed. No bump needed."
            exit 0
          fi
          echo "These ship:"; echo "$ships"
          was=$(git show "$base:.claude-plugin/plugin.json" | grep -o '"version": "[^"]*"' | head -1)
          now=$(grep -o '"version": "[^"]*"' .claude-plugin/plugin.json | head -1)
          if [ "$was" = "$now" ]; then
            echo "::error::$now is unchanged, but files that ship were modified."
            echo "Run: uv run cz bump --yes"
            exit 1
          fi
          echo "Version moved: $was -> $now"
